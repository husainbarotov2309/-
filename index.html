<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Гостиница</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111827;
    color: #fff;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}

.hidden {
    display: none !important;
}

/* LOGIN */

#loginScreen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 400px;
    background: #1f2937;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 15px 50px rgba(0,0,0,.4);
}

.login-box h1 {
    text-align: center;
    margin-top: 0;
}

.login-box input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: 1px solid #374151;
    border-radius: 10px;
    background: #111827;
    color: white;
    outline: none;
}

.login-box button {
    width: 100%;
    margin-top: 12px;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-weight: bold;
}

.login-box button:hover {
    background: #1d4ed8;
}

#errorMessage {
    color: #f87171;
    text-align: center;
    margin-top: 12px;
}

/* APP */

header {
    background: #1f2937;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    box-shadow: 0 3px 15px rgba(0,0,0,.25);
}

header h1 {
    margin: 0;
    font-size: 24px;
}

.user-area {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.user-email {
    color: #9ca3af;
    font-size: 14px;
}

.logout-btn {
    background: #dc2626;
    color: white;
    border: none;
    padding: 9px 14px;
    border-radius: 9px;
}

.container {
    max-width: 1400px;
    margin: auto;
    padding: 20px;
}

.section {
    margin-bottom: 30px;
}

.section h2 {
    margin-bottom: 15px;
}

/* ROOMS */

.rooms {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.room {
    background: #1f2937;
    border-radius: 16px;
    padding: 18px;
    border: 2px solid #374151;
    transition: .2s;
}

.room:hover {
    transform: translateY(-2px);
}

.room.free {
    border-color: #16a34a;
}

.room.busy {
    border-color: #dc2626;
}

.room h3 {
    margin-top: 0;
    font-size: 21px;
}

.status {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 7px;
    font-size: 13px;
    margin-bottom: 10px;
}

.status.free {
    background: #14532d;
    color: #86efac;
}

.status.busy {
    background: #7f1d1d;
    color: #fca5a5;
}

.room-info {
    color: #d1d5db;
    line-height: 1.6;
    min-height: 95px;
}

.room-buttons {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.room-buttons button {
    flex: 1;
    border: none;
    padding: 10px;
    border-radius: 9px;
    color: white;
}

.checkin-btn {
    background: #16a34a;
}

.checkout-btn {
    background: #dc2626;
}

/* BUTTONS */

.action-btn {
    border: none;
    color: white;
    padding: 10px 15px;
    border-radius: 9px;
    margin: 4px;
}

.blue {
    background: #2563eb;
}

.green {
    background: #16a34a;
}

.red {
    background: #dc2626;
}

.gray {
    background: #4b5563;
}

/* TABLE */

.table-wrapper {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #1f2937;
    border-radius: 12px;
    overflow: hidden;
}

th,
td {
    padding: 11px;
    border-bottom: 1px solid #374151;
    text-align: left;
}

th {
    background: #374151;
}

.empty {
    color: #9ca3af;
    text-align: center;
    padding: 20px;
}

/* NOTES */

.note {
    background: #1f2937;
    padding: 14px;
    border-radius: 12px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.note-text {
    white-space: pre-wrap;
}

/* MODAL */

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
}

.modal {
    width: 100%;
    max-width: 500px;
    background: #1f2937;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    animation: modalIn .2s ease;
}

@keyframes modalIn {
    from {
        opacity: 0;
        transform: scale(.92);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.modal h2 {
    margin-top: 0;
}

.modal input,
.modal textarea {
    width: 100%;
    padding: 12px;
    margin: 7px 0;
    background: #111827;
    color: white;
    border: 1px solid #374151;
    border-radius: 9px;
    outline: none;
}

.modal textarea {
    min-height: 120px;
    resize: vertical;
}

.modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.modal-buttons button {
    flex: 1;
    border: none;
    padding: 11px;
    border-radius: 9px;
    color: white;
}

.close-btn {
    background: #4b5563;
}

.save-btn {
    background: #2563eb;
}

/* MOBILE */

@media (max-width: 1000px) {
    .rooms {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 700px) {
    .rooms {
        grid-template-columns: repeat(2, 1fr);
    }

    header {
        align-items: flex-start;
    }
}

@media (max-width: 480px) {
    .rooms {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 12px;
    }

    .room {
        padding: 15px;
    }

    th,
    td {
        font-size: 13px;
        padding: 8px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen">
    <div class="login-box">
        <h1>🏨 Гостиница</h1>

        <input
            id="loginEmail"
            type="email"
            placeholder="Электронная почта"
        >

        <input
            id="loginPassword"
            type="password"
            placeholder="Пароль"
        >

        <button onclick="login()">Войти</button>

        <div id="errorMessage"></div>
    </div>
</div>


<!-- APPLICATION -->

<div id="app" class="hidden">

<header>
    <h1>🏨 Управление гостиницей</h1>

    <div class="user-area">
        <span class="user-email" id="userEmail"></span>
        <button class="logout-btn" onclick="logout()">Выйти</button>
    </div>
</header>


<div class="container">

    <!-- ROOMS -->

    <section class="section">
        <h2>🛏 Номера</h2>
        <div id="rooms" class="rooms"></div>
    </section>


    <!-- INCOME -->

    <section class="section">
        <h2>💰 Доход</h2>

        <button class="action-btn blue" onclick="openIncomeModal()">
            + Добавить оплату
        </button>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Дата</th>
                        <th>Номер</th>
                        <th>Гость</th>
                        <th>Гостей</th>
                        <th>Сумма</th>
                        <th></th>
                    </tr>
                </thead>

                <tbody id="incomeTable"></tbody>
            </table>
        </div>

        <h3>
            Общий доход:
            <span id="totalIncome">0</span> сомони
        </h3>
    </section>


    <!-- RECEIPTS -->

    <section class="section">
        <h2>🧾 Квитанции</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Дата</th>
                        <th>Номер</th>
                        <th>Гость</th>
                        <th>Гостей</th>
                        <th>Дней</th>
                        <th>Сумма</th>
                        <th>Действия</th>
                    </tr>
                </thead>

                <tbody id="receiptsTable"></tbody>
            </table>
        </div>
    </section>


    <!-- NOTES -->

    <section class="section">
        <h2>📝 Заметки</h2>

        <button class="action-btn blue" onclick="openNoteModal()">
            + Добавить заметку
        </button>

        <div id="notesList"></div>
    </section>

</div>
</div>


<!-- MODAL -->

<div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal" id="modalContent"></div>
</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://xvtjibuyizqxpmnrzjud.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_30kUdyYOPTZM_1sJL_phtQ_DuMp_plZ";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   DATA
========================= */

let roomsData = [];
let incomeData = [];
let receiptsData = [];
let notesData = [];

let currentUser = null;


/* =========================
   START
========================= */

document.addEventListener("DOMContentLoaded", async () => {

    const {
        data: { session }
    } = await supabaseClient.auth.getSession();

    if (session) {
        currentUser = session.user;
        showApp();
        await loadAllData();
        subscribeRealtime();
    } else {
        showLogin();
    }

    supabaseClient.auth.onAuthStateChange(
        async (event, session) => {

            if (session) {
                currentUser = session.user;
                showApp();
                await loadAllData();
                subscribeRealtime();
            } else {
                currentUser = null;
                showLogin();
            }

        }
    );
});


/* =========================
   AUTH
========================= */

async function login() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const error =
        document.getElementById("errorMessage");

    error.textContent = "";

    if (!email || !password) {
        error.textContent =
            "Введите email и пароль.";
        return;
    }

    const { error: loginError } =
        await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

    if (loginError) {
        error.textContent =
            "Неверный email или пароль.";
        console.error(loginError);
    }
}


async function logout() {

    await supabaseClient.auth.signOut();
}


function showLogin() {

    document
        .getElementById("loginScreen")
        .classList.remove("hidden");

    document
        .getElementById("app")
        .classList.add("hidden");
}


function showApp() {

    document
        .getElementById("loginScreen")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");

    document
        .getElementById("userEmail")
        .textContent =
        currentUser?.email || "";
}


/* =========================
   LOAD DATA
========================= */

async function loadAllData() {

    try {

        const rooms =
            await supabaseClient
                .from("rooms")
                .select("*")
                .order("number");

        const income =
            await supabaseClient
                .from("income_records")
                .select("*")
                .order("created_at", {
                    ascending: false
                });

        const receipts =
            await supabaseClient
                .from("receipts")
                .select("*")
                .order("created_at", {
                    ascending: false
                });

        const notes =
            await supabaseClient
                .from("notes")
                .select("*")
                .order("created_at", {
                    ascending: false
                });


        if (rooms.error) throw rooms.error;
        if (income.error) throw income.error;
        if (receipts.error) throw receipts.error;
        if (notes.error) throw notes.error;


        roomsData = rooms.data || [];
        incomeData = income.data || [];
        receiptsData = receipts.data || [];
        notesData = notes.data || [];


        renderRooms();
        renderIncome();
        renderReceipts();
        renderNotes();

    } catch (error) {

        console.error(error);

        alert(
            "Не удалось загрузить данные из базы."
        );
    }
}


/* =========================
   REALTIME
========================= */

let realtimeStarted = false;

function subscribeRealtime() {

    if (realtimeStarted) return;

    realtimeStarted = true;

    supabaseClient
        .channel("hotel-live")
        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "rooms"
            },
            async () => {
                await loadAllData();
            }
        )
        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "income_records"
            },
            async () => {
                await loadAllData();
            }
        )
        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "receipts"
            },
            async () => {
                await loadAllData();
            }
        )
        .on(
            "postgres_changes",
            {
                event: "*",
                schema: "public",
                table: "notes"
            },
            async () => {
                await loadAllData();
            }
        )
        .subscribe();
}


/* =========================
   ROOMS
========================= */

function renderRooms() {

    const container =
        document.getElementById("rooms");

    container.innerHTML = "";

    roomsData.forEach(room => {

        const busy =
            room.status === "busy";

        const div =
            document.createElement("div");

        div.className =
            `room ${busy ? "busy" : "free"}`;

        if (busy) {

            div.innerHTML = `
                <h3>Номер ${room.number}</h3>

                <div class="status busy">
                    Занят
                </div>

                <div class="room-info">
                    <b>Гость:</b>
                    ${escapeHTML(room.guest || "—")}
                    <br>

                    <b>Телефон:</b>
                    ${escapeHTML(room.phone || "—")}
                    <br>

                    <b>Гостей:</b>
                    ${room.guest_count || 0}
                    <br>

                    <b>Дней:</b>
                    ${room.days || 0}
                    <br>

                    <b>Оплата:</b>
                    ${Number(room.payment || 0).toFixed(2)} сомони
                </div>

                <div class="room-buttons">
                    <button
                        class="checkout-btn"
                        onclick="checkoutRoom(${room.number})">
                        Выселить
                    </button>
                </div>
            `;

        } else {

            div.innerHTML = `
                <h3>Номер ${room.number}</h3>

                <div class="status free">
                    Свободен
                </div>

                <div class="room-info">
                    Номер свободен
                </div>

                <div class="room-buttons">
                    <button
                        class="checkin-btn"
                        onclick="checkinRoom(${room.number})">
                        Заселить
                    </button>
                </div>
            `;
        }

        container.appendChild(div);
    });
}


/* =========================
   CHECK-IN
========================= */

function checkinRoom(roomNumber) {

    openModal(`
        <h2>Заселение — номер ${roomNumber}</h2>

        <input
            id="guestName"
            placeholder="Имя гостя (необязательно)"
        >

        <input
            id="guestPhone"
            placeholder="Телефон (необязательно)"
        >

        <input
            id="guestCount"
            type="number"
            min="1"
            value="1"
            placeholder="Количество гостей"
        >

        <input
            id="days"
            type="number"
            min="1"
            value="1"
            placeholder="Количество дней"
        >

        <input
            id="payment"
            type="number"
            min="0"
            step="0.01"
            value="0"
            placeholder="Сколько заплатил гость"
        >

        <div class="modal-buttons">
            <button
                class="close-btn"
                onclick="closeModal()">
                Отмена
            </button>

            <button
                class="save-btn"
                onclick="saveCheckin(${roomNumber})">
                Заселить
            </button>
        </div>
    `);
}


async function saveCheckin(roomNumber) {

    const guest =
        document.getElementById("guestName")
            .value.trim();

    const phone =
        document.getElementById("guestPhone")
            .value.trim();

    const guestCount =
        Number(
            document.getElementById("guestCount")
                .value
        ) || 1;

    const days =
        Number(
            document.getElementById("days")
                .value
        ) || 1;

    const payment =
        Number(
            document.getElementById("payment")
                .value
        ) || 0;


    const { error } =
        await supabaseClient
            .from("rooms")
            .update({
                status: "busy",
                guest,
                phone,
                guest_count: guestCount,
                days,
                payment
            })
            .eq("number", roomNumber);


    if (error) {

        console.error(error);

        alert(
            "Ошибка при заселении."
        );

        return;
    }


    closeModal();

    await loadAllData();
}


/* =========================
   CHECK-OUT
========================= */

async function checkoutRoom(roomNumber) {

    const room =
        roomsData.find(
            r => r.number === roomNumber
        );

    if (!room) return;


    openModal(`
        <h2>Выселение — номер ${roomNumber}</h2>

        <p>
            <b>Гость:</b>
            ${escapeHTML(room.guest || "—")}
        </p>

        <p>
            <b>Гостей:</b>
            ${room.guest_count || 0}
        </p>

        <p>
            <b>Оплата:</b>
            ${Number(room.payment || 0).toFixed(2)}
            сомони
        </p>

        <p>
            После выселения будет создана квитанция
            и запись о доходе.
        </p>

        <div class="modal-buttons">
            <button
                class="close-btn"
                onclick="closeModal()">
                Отмена
            </button>

            <button
                class="save-btn"
                onclick="confirmCheckout(${roomNumber})">
                Выселить
            </button>
        </div>
    `);
}


async function confirmCheckout(roomNumber) {

    const room =
        roomsData.find(
            r => r.number === roomNumber
        );

    if (!room) return;


    const amount =
        Number(room.payment || 0);


    /* Создаём квитанцию */

    const { data: receipt, error: receiptError } =
        await supabaseClient
            .from("receipts")
            .insert({
                room_number: room.number,
                guest: room.guest || "",
                phone: room.phone || "",
                guest_count: room.guest_count || 0,
                days: room.days || 0,
                amount
            })
            .select()
            .single();


    if (receiptError) {

        console.error(receiptError);

        alert(
            "Не удалось создать квитанцию."
        );

        return;
    }


    /* Создаём доход */

    const { error: incomeError } =
        await supabaseClient
            .from("income_records")
            .insert({
                room_number: room.number,
                amount,
                guest: room.guest || "",
                guest_count: room.guest_count || 0
            });


    if (incomeError) {

        console.error(incomeError);

        alert(
            "Квитанция создана, но доход не записался."
        );

        return;
    }


    /* Освобождаем номер */

    const { error: roomError } =
        await supabaseClient
            .from("rooms")
            .update({
                status: "free",
                guest: null,
                phone: null,
                guest_count: 0,
                days: 0,
                payment: 0
            })
            .eq("number", roomNumber);


    if (roomError) {

        console.error(roomError);

        alert(
            "Оплата сохранена, но номер не удалось освободить."
        );

        return;
    }


    closeModal();

    await loadAllData();
}


/* =========================
   INCOME
========================= */

function renderIncome() {

    const tbody =
        document.getElementById("incomeTable");

    tbody.innerHTML = "";


    let total = 0;


    if (incomeData.length === 0) {

        tbody.innerHTML = `
            <tr>
                <td
                    colspan="6"
                    class="empty">
                    Записей пока нет
                </td>
            </tr>
        `;

    } else {

        incomeData.forEach(item => {

            total += Number(item.amount || 0);

            const tr =
                document.createElement("tr");

            tr.innerHTML = `
                <td>
                    ${formatDate(item.created_at)}
                </td>

                <td>
                    ${item.room_number ?? "—"}
                </td>

                <td>
                    ${escapeHTML(item.guest || "—")}
                </td>

                <td>
                    ${item.guest_count || 0}
                </td>

                <td>
                    ${Number(item.amount || 0).toFixed(2)}
                    сомони
                </td>

                <td>
                    <button
                        class="action-btn red"
                        onclick="deleteIncome(${item.id})">
                        Отменить
                    </button>
                </td>
            `;

            tbody.appendChild(tr);
        });
    }


    document.getElementById("totalIncome")
        .textContent =
        total.toFixed(2);
}


function openIncomeModal() {

    openModal(`
        <h2>Добавить оплату</h2>

        <input
            id="incomeRoom"
            type="number"
            min="1"
            placeholder="Номер комнаты"
        >

        <input
            id="incomeGuest"
            placeholder="Имя гостя"
        >

        <input
            id="incomeGuestCount"
            type="number"
            min="1"
            value="1"
            placeholder="Количество гостей"
        >

        <input
            id="incomeAmount"
            type="number"
            min="0"
            step="0.01"
            placeholder="Сумма"
        >

        <div class="modal-buttons">
            <button
                class="close-btn"
                onclick="closeModal()">
                Отмена
            </button>

            <button
                class="save-btn"
                onclick="saveIncome()">
                Сохранить
            </button>
        </div>
    `);
}


async function saveIncome() {

    const room =
        Number(
            document.getElementById("incomeRoom").value
        );

    const guest =
        document.getElementById("incomeGuest")
            .value.trim();

    const guestCount =
        Number(
            document.getElementById("incomeGuestCount")
                .value
        ) || 1;

    const amount =
        Number(
            document.getElementById("incomeAmount")
                .value
        );


    if (!amount || amount < 0) {

        alert("Введите сумму.");

        return;
    }


    const { error } =
        await supabaseClient
            .from("income_records")
            .insert({
                room_number:
                    room || null,
                amount,
                guest,
                guest_count:
                    guestCount
            });


    if (error) {

        console.error(error);

        alert(
            "Не удалось добавить оплату."
        );

        return;
    }


    closeModal();

    await loadAllData();
}

/* =========================
   MODAL
========================= */

function openModal(html) {

    document
        .getElementById("modalContent")
        .innerHTML = html;

    document
        .getElementById("modalOverlay")
        .classList.remove("hidden");
}


function closeModal() {

    document
        .getElementById("modalOverlay")
        .classList.add("hidden");
}


document
    .getElementById("modalOverlay")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {
                closeModal();
            }

        }
    );


/* =========================
   HELPERS
========================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function formatDate(dateString) {

    if (!dateString) return "—";

    const date =
        new Date(dateString);

    return date.toLocaleString(
        "ru-RU",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}
